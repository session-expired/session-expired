<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/css/game.css" />
    <link rel="stylesheet" href="/css/global.css" />
    <link rel="stylesheet" href="/__multi/multi.css" />
    <title>Session Expired — Four-player test</title>
  </head>
  <body class="game-page multi-page">
    <header class="game-header">
      <strong>MULTI PLAYER TEST</strong>
      <button id="reset-game" type="button">Reset game</button>
    </header>
    <aside id="multi-panel">
      <p id="controlled-player">Controlled test player: none</p>
      <div id="debug-summary">Loading state…</div>
      <form id="accusation-form">
        <strong>Accusation</strong>
        <span id="accusation-status">You must reach the Warden to make an accusation.</span>
        <select name="killer" aria-label="Killer"></select>
        <select name="victim" aria-label="Victim"></select>
        <select name="room" aria-label="Room"></select>
        <select name="method" aria-label="Method"></select>
        <button type="submit" disabled>Accuse</button>
      </form>
      <details><summary>Raw JSON state</summary><pre id="raw-state"></pre></details>
    </aside>
    <main id="game">
      <p id="game-status" role="status">Loading game…</p>
      <div class="turn-controls"><span id="turn-status"></span><button id="roll-movement" type="button" hidden>Roll 1d8</button><button id="end-turn" type="button" hidden>End Turn</button></div>
      <div class="board-controls" aria-label="Board zoom controls">
        <button id="zoom-out" type="button">−</button><button id="zoom-reset" type="button">100%</button><button id="zoom-in" type="button">+</button>
      </div>
      <div id="board-viewport"><div id="board"></div></div>
      <p id="clickOutput"></p>
    </main>
    <button id="quit-game" type="button" hidden>Leave Game</button>
    <script src="/__multi/turn-controller.js"></script>
    <script src="/__multi/multi-client.js"></script>
    <script src="/js/game/board.js"></script>
  </body>
</html>
