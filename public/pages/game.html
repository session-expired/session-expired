<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/assets/images/favicon.png" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" />
    <link rel="stylesheet" href="../css/game.css" />
    <link rel="stylesheet" href="../css/global.css" />
    <title>Session Expired</title>
  </head>
  <body class="game-page">
    <header class="game-header">
      <button id="quit-game" type="button">Leave Game</button>
      <div class="music-controls" aria-label="Game music controls">
        <button id="music-toggle" type="button" aria-pressed="true" aria-label="Pause music">
          Pause music
        </button>
        <label for="music-volume">Volume</label>
        <input
          id="music-volume"
          type="range"
          min="0"
          max="1"
          step="0.05"
          value="0.4"
          aria-label="Music volume"
        />
      </div>
    </header>
    <main id="game">
  <aside id="journal-panel" class="journal-panel">
    <div class="journal-panel-header">
      Investigation Journal (<span id="journal-count">0</span>)
    </div>
    <div class="journal-paper">
      <h2>Case Notes</h2>
      <div id="journal-entries"><p class="journal-empty">No clues recorded yet.</p></div>
    </div>
  </aside>
  <div id="game-main" class="game-main">
    <p id="game-status" role="status">Loading game…</p>
    <div class="turn-controls">
      <span id="turn-status"></span>
      <button id="roll-movement" type="button" hidden>Roll 1d8</button>
      <button id="end-turn" type="button" hidden>End Turn</button>
    </div>
    <section class="deduction-actions" aria-label="Deduction actions">
      <div><button id="open-guess" type="button" disabled>Guess</button><small id="guess-availability">Use all movement</small></div>
      <div><button id="open-accusation" type="button" disabled>Accuse</button><small id="accusation-availability">Warden out of range</small></div>
    </section>
    <form id="deduction-panel" class="deduction-panel" hidden>
      <div class="deduction-heading"><h2 id="deduction-title">Deduction</h2><span>Known eliminations marked ×</span></div>
      <div id="deduction-fields" class="deduction-fields"></div>
      <div class="deduction-footer"><button id="cancel-deduction" type="button">Cancel</button><button id="submit-deduction" type="submit">Submit</button></div>
    </form>
    <div class="board-controls" aria-label="Board zoom controls">
      <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
      <button id="zoom-reset" type="button">100%</button>
      <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
    </div>
    <div id="board-viewport">
      <div id="board"></div>
      <section id="game-result" class="game-result" hidden aria-live="assertive">
        <h1 id="game-result-message"></h1>
        <button id="finished-leave-game" type="button">Leave Game</button>
      </section>
    </div>
    <!-- This line is a temporary testing feature to see where you're clicking, see public/game/board.js -->
    <p id="clickOutput" hidden></p>
  </div>
</main>
    
    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/chat.js"></script>
    <script src="/js/game/music.js"></script>
    <script type="module" src="/js/game/board.js"></script>
  </body>
</html>
