<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="/assets/images/favicon.png">
  <title>Asset Tester</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; color: #eee; background: #171717; font-family: monospace; }
    main { max-width: 900px; margin: 0 auto; }
    section { margin-bottom: 24px; padding: 16px; border: 1px solid #555; background: #222; }
    h1, h2 { margin-top: 0; }
    .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; margin-bottom: 16px; }
    label { display: flex; align-items: center; gap: 8px; }
    button, select, input { font: inherit; }
    #sprite-stage {
      min-height: 320px;
      display: grid;
      place-items: center;
      border: 1px solid #555;
      background-color: #aaa;
      background-image: linear-gradient(45deg, #777 25%, transparent 25%),
        linear-gradient(-45deg, #777 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #777 75%),
        linear-gradient(-45deg, transparent 75%, #777 75%);
      background-size: 32px 32px;
      background-position: 0 0, 0 16px, 16px -16px, -16px 0;
    }
    canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
    .status { margin-top: 12px; color: #bbb; }
  </style>
</head>
<body>
  <main>
    <h1>Asylum Asset Tester</h1>

    <section>
      <h2>Character sprites</h2>
      <div class="controls">
        <label>
          Character
          <select id="character">
            <option value="rasputin">Rasputin</option>
            <option value="brahe">Brahe</option>
            <option value="lovelace">Lovelace</option>
            <option value="crowley">Crowley</option>
            <option value="curie">Curie</option>
            <option value="mallon">Mallon</option>
            <option value="bonaparte">Bonaparte</option>
          </select>
        </label>
        <label>
          Tag area
          <select id="sprite" disabled>
            <option>Loading tags…</option>
          </select>
        </label>
        <label>
          Scale
          <select id="scale">
            <option value="1">1x</option>
            <option value="2">2x</option>
            <option value="3" selected>3x</option>
            <option value="4">4x</option>
            <option value="6">6x</option>
            <option value="8">8x</option>
          </select>
        </label>
        <button id="pause" type="button">Pause</button>
      </div>
      <div id="sprite-stage"><canvas id="sprite-canvas"></canvas></div>
      <div id="sprite-status" class="status">Loading sprite…</div>
    </section>

    <section>
      <h2>Music</h2>
      <div class="controls">
        <label>
          Track
          <select id="music-track" disabled>
            <option>Loading tracks…</option>
          </select>
        </label>
        <button id="music-play" type="button">Play</button>
        <button id="music-mute" type="button">Mute</button>
        <label>
          Volume
          <input id="music-volume" type="range" min="0" max="1" step="0.01" value="0.4">
        </label>
      </div>
      <div id="music-status" class="status">Loading music folder…</div>
    </section>
  </main>

  <script>
    const canvas = document.querySelector("#sprite-canvas");
    const context = canvas.getContext("2d");
    const characterSelect = document.querySelector("#character");
    const spriteSelect = document.querySelector("#sprite");
    const scaleSelect = document.querySelector("#scale");
    const pauseButton = document.querySelector("#pause");
    const spriteStatus = document.querySelector("#sprite-status");

    let spriteImage = null;
    let spriteFile = "";
    let taggedFrames = new Map();
    let activeFrames = [];
    let frameIndex = 0;
    let frameElapsed = 0;
    let previousTime = 0;
    let paused = false;

    function framesForTag(allFrames, tag) {
      const from = Math.max(0, Number(tag.from));
      const to = Math.min(allFrames.length - 1, Number(tag.to));
      if (!Number.isInteger(from) || !Number.isInteger(to) || from > to) return [];

      const frames = allFrames.slice(from, to + 1);
      if (tag.direction === "reverse") return frames.reverse();
      if (tag.direction === "pingpong" && frames.length > 2) {
        return frames.concat(frames.slice(1, -1).reverse());
      }
      if (tag.direction === "pingpong_reverse" && frames.length > 2) {
        return frames.slice().reverse().concat(frames.slice(1, -1));
      }
      return frames;
    }

    function selectTag() {
      activeFrames = taggedFrames.get(spriteSelect.value) ?? [];
      frameIndex = 0;
      frameElapsed = 0;
      drawSprite();
    }

    async function loadSprites() {
      const character = characterSelect.value;
      const encodedCharacter = encodeURIComponent(character);
      const assetRoot = `/assets/images/chars/${encodedCharacter}`;
      const requestedImage = new Image();
      spriteStatus.textContent = `Loading ${character}…`;
      spriteSelect.disabled = true;

      try {
        const response = await fetch(`${assetRoot}/${encodedCharacter}.json`);
        if (!response.ok) throw new Error(`JSON request failed (${response.status})`);
        const asepriteData = await response.json();

        // This Aseprite export uses an object keyed by source frame name.
        const allFrames = Array.isArray(asepriteData.frames)
          ? asepriteData.frames
          : Object.values(asepriteData.frames);
        const tags = asepriteData.meta?.frameTags ?? [];
        if (!allFrames.length) throw new Error("JSON contains no frames");
        if (!tags.length) throw new Error("JSON contains no frame tags");

        const requestedTags = new Map();
        for (const tag of tags) {
          const frames = framesForTag(allFrames, tag);
          if (tag.name && frames.length) requestedTags.set(tag.name, frames);
        }
        if (!requestedTags.size) throw new Error("JSON contains no valid frame tags");

        const requestedSpriteFile = asepriteData.meta?.image || `${character}.png`;
        requestedImage.src = `${assetRoot}/${encodeURIComponent(requestedSpriteFile)}`;

        await requestedImage.decode();
        if (character !== characterSelect.value) return;

        spriteImage = requestedImage;
        spriteFile = requestedSpriteFile;
        taggedFrames = requestedTags;
        spriteSelect.replaceChildren(...Array.from(taggedFrames.keys(), (tag) => new Option(tag, tag)));
        spriteSelect.disabled = false;
        selectTag();
      } catch (error) {
        if (character === characterSelect.value) {
          spriteImage = null;
          taggedFrames = new Map();
          activeFrames = [];
          spriteSelect.replaceChildren(new Option("No tags available", ""));
          spriteSelect.disabled = true;
          context.clearRect(0, 0, canvas.width, canvas.height);
          spriteStatus.textContent = `${character}: assets not available yet (${error.message})`;
        }
      }
    }

    function drawSprite() {
      const scale = Number(scaleSelect.value);
      if (!spriteImage || !activeFrames.length) return;
      const frameData = activeFrames[frameIndex];
      const frame = frameData.frame;

      if (!frame.w || !frame.h) return;
      canvas.width = frame.w * scale;
      canvas.height = frame.h * scale;
      context.imageSmoothingEnabled = false;
      context.clearRect(0, 0, canvas.width, canvas.height);
      context.drawImage(spriteImage, frame.x, frame.y, frame.w, frame.h, 0, 0, canvas.width, canvas.height);
      const character = characterSelect.value;
      spriteStatus.textContent = `${character} / ${spriteSelect.value} — ${spriteFile}, frame ${frameIndex + 1} of ${activeFrames.length} (${frame.w} × ${frame.h}px)`;
    }

    function animate(time) {
      const delta = time - previousTime;
      previousTime = time;

      if (!paused && activeFrames.length > 1) {
        frameElapsed += delta;
        const duration = activeFrames[frameIndex].duration || 100;
        if (frameElapsed >= duration) {
          frameElapsed %= duration;
          frameIndex = (frameIndex + 1) % activeFrames.length;
        }
      }

      drawSprite();
      requestAnimationFrame(animate);
    }

    characterSelect.addEventListener("change", loadSprites);
    spriteSelect.addEventListener("change", selectTag);
    scaleSelect.addEventListener("change", drawSprite);
    pauseButton.addEventListener("click", () => {
      paused = !paused;
      pauseButton.textContent = paused ? "Resume" : "Pause";
    });

    const music = new Audio();
    music.loop = true;
    music.volume = 0.4;
    const trackSelect = document.querySelector("#music-track");
    const playButton = document.querySelector("#music-play");
    const muteButton = document.querySelector("#music-mute");
    const musicStatus = document.querySelector("#music-status");

    function selectedTrackName() {
      return trackSelect.value;
    }

    function selectTrack() {
      const track = selectedTrackName();
      music.pause();
      music.src = `/assets/audio/music/${encodeURIComponent(track)}`;
      music.load();
      playButton.textContent = "Play";
      musicStatus.textContent = `${track} — stopped`;
    }

    async function loadMusicTracks() {
      try {
        const response = await fetch("/api/music");
        if (!response.ok) throw new Error(`folder request failed (${response.status})`);
        const { files } = await response.json();

        trackSelect.replaceChildren();
        for (const file of files) {
          const option = document.createElement("option");
          option.value = file;
          option.textContent = file;
          trackSelect.append(option);
        }

        if (!files.length) {
          trackSelect.append(new Option("No audio files found", ""));
          playButton.disabled = true;
          musicStatus.textContent = "No supported audio files found";
          return;
        }

        trackSelect.disabled = false;
        selectTrack();
      } catch (error) {
        playButton.disabled = true;
        musicStatus.textContent = `Unable to enumerate music: ${error.message}`;
      }
    }

    trackSelect.addEventListener("change", selectTrack);

    playButton.addEventListener("click", async () => {
      try {
        if (music.paused) {
          await music.play();
          playButton.textContent = "Pause";
          musicStatus.textContent = `${selectedTrackName()} — playing`;
        } else {
          music.pause();
          playButton.textContent = "Play";
          musicStatus.textContent = `${selectedTrackName()} — paused`;
        }
      } catch (error) {
        musicStatus.textContent = `Unable to play audio: ${error.message}`;
      }
    });

    muteButton.addEventListener("click", () => {
      music.muted = !music.muted;
      muteButton.textContent = music.muted ? "Unmute" : "Mute";
    });
    document.querySelector("#music-volume").addEventListener("input", (event) => {
      music.volume = Number(event.target.value);
    });

    loadSprites();
    loadMusicTracks();
    requestAnimationFrame(animate);
  </script>
</body>
</html>
