<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/assets/images/favicon.png" />
    <title>Session Expired</title>
    <link rel="stylesheet" href="../css/global.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <h1 style = "text-align: center;">SESSION EXPIRED</h1>
    <nav>
      <ul>
        <li><a href="../index.html">Home</a></li>
        <li><a href="./instructions.html">How to Play</a></li>
        <li><a href="" class="current">Contact</a></li>
        <li><a href="./lobbyPage.html">Lobby</a></li>
        <li><a href="./login.html" data-auth-link>Login</a></li>
      </ul>
    </nav>
    <div class = "contact-card">
      <h2>Get in Touch</h2>
      <form>
        <div class="field">
          <label for="fullName">Full Name</label>
            <input type="text" id="fullName" name="fullName" placeholder="Your name" required />
        </div>

        <div class="field">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="email@example.com" required />
        </div>

        <div class="field">
          <label for="phone">Phone Number(Optional)</label>
          <input type="tel" id="phone" name="phone" placeholder="(123) 456-7890" />
        </div>

        <div class="field">
          <label for="subject">Subject</label>
          <select id="subject" name="subject" required>
            <option value="" disabled selected>Select option</option>
            <option value="bug">Bug Report</option>
            <option value="feedback">Feedback</option>
            <option value="account">Account Issue</option>
            <option value="other">Other</option>
          </select> 
        </div>

        <div class="field full-width">
          <label for="message">Message</label>
          <textarea id="message" name="message" placeholder="What can we help you with?" required></textarea>
        </div>

        <button type="submit">Send Message</button>

      </form>
    
    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/session-nav.js"></script>
    <script src="/js/chat.js"></script>
  </body>
</html>
