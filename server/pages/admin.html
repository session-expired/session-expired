<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Administration | Session Expired</title>
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/admin.css">
  </head>
  <body>
    <header class="site-header"><a class="brand" href="/">Session Expired</a><nav><a href="/lobby">Back to Game</a><a href="/account">Account</a></nav></header>
    <main class="admin-shell">
      <div class="admin-heading"><div><p class="eyebrow">Restricted Area</p><h1>Admin control panel</h1></div><button id="refresh-all" type="button">Refresh</button></div>
      <p id="admin-status" class="status" role="status" aria-live="polite"></p>

      <section class="admin-panel"><h2>Connected Users</h2><div class="table-wrap"><table><thead><tr><th>User</th><th>ID</th><th>Location</th><th>Connections</th><th>Controls</th></tr></thead><tbody id="connected-users"></tbody></table></div></section>
      <section class="admin-panel"><h2>Banned Users</h2><div class="table-wrap"><table><thead><tr><th>User</th><th>ID</th><th>Reason</th><th>Banned by</th><th>Date</th><th>Expiration</th><th></th></tr></thead><tbody id="banned-users"></tbody></table></div></section>
      <section class="admin-panel">
        <div class="panel-heading"><h2>Historic Chat</h2><div class="filters"><input id="message-user-filter" placeholder="Filter username"><input id="message-text-filter" placeholder="Filter message"><input id="message-lobby-filter" placeholder="Lobby/game ID"></div></div>
        <div class="table-wrap"><table><thead><tr><th>Time</th><th>User</th><th>Message</th><th>Channel</th><th>Lobby/game</th></tr></thead><tbody id="message-history"></tbody></table></div>
        <button id="load-more" type="button">Load More</button>
      </section>
      <section class="admin-panel"><h2>Recent Moderation Activity</h2><div class="table-wrap"><table><thead><tr><th>Time</th><th>Admin</th><th>Action</th><th>Target</th><th>Details</th></tr></thead><tbody id="action-history"></tbody></table></div></section>
    </main>

    <dialog id="ban-dialog"><form id="ban-form"><h2>Ban <span id="ban-username"></span>?</h2><input id="ban-user-id" type="hidden"><label>Reason<textarea id="ban-reason" maxlength="500" rows="3"></textarea></label><label>Duration<select id="ban-duration"><option value="">Permanent</option><option value="1">1 hour</option><option value="24">24 hours</option><option value="168">7 days</option></select></label><div class="dialog-actions"><button type="button" id="cancel-ban">Cancel</button><button type="submit" class="danger">Ban User</button></div></form></dialog>
    <script src="/js/admin.js"></script>
  </body>
</html>
