<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="/assets/images/favicon.png" />
    <title>Create Account | Session Expired</title>
    <link rel="stylesheet" href="/css/auth.css" />
    <link rel="stylesheet" href="../css/global.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="auth-shell">
      <section class="auth-card" aria-labelledby="page-title">
        <p class="eyebrow">Patient Registry</p>
        <h1 id="page-title">Create an account</h1>
        <p class="intro">Enter your details to be admitted.</p>
        <form id="register-form" novalidate>
          <div class="field"><label for="username">Username</label><input id="username" name="username" autocomplete="username" maxlength="30" required /><p class="error" id="username-error"></p></div>
          <div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" maxlength="254" required /><p class="error" id="email-error"></p></div>
          <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required /><p class="error" id="password-error"></p></div>
          <div class="field"><label for="confirmPassword">Confirm password</label><input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required /><p class="error" id="confirmPassword-error"></p></div>
          <p class="error form-error" id="form-error" role="alert"></p>
          <button type="submit">Create account</button>
        </form>
        <p class="switch-link">Already registered? <a href="/login">Sign in</a></p>
      </section>
    </main>
    <script src="/js/auth.js"></script>
  </body>
</html>
